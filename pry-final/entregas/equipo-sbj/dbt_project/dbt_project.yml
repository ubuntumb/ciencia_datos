name: minimercado
version: "1.0.0"
config-version: 2
profile: minimercado

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# Parámetros de negocio usados por mart_rotacion_inventario
vars:
  dias_reposicion: 7   # lead time del proveedor (días)
  dias_seguridad: 3    # colchón de seguridad (días)
  ventana_dias: 30     # ventana para estimar la venta diaria reciente

models:
  minimercado:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
