[project]
name = "minimercado-tp-data-g5"
version = "0.1.0"
description = "Pipeline analítico de un minimercado: datos sintéticos, dlt, DuckDB, dbt y Dagster"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.0",
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "pytest>=8.0",
]
