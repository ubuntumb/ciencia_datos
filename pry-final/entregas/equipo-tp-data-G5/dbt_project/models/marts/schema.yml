version: 2

models:
  - name: mart_ventas_diarias
    description: Una fila por día con transacciones, unidades y facturación.
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: facturacion_neta
        data_tests: [not_null]

  - name: mart_rentabilidad_productos
    description: Ganancia bruta y margen por producto, con costo promedio ponderado.
    columns:
      - name: producto_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_productos')
                field: producto_id

  - name: mart_rotacion_inventario
    description: Rotación, días de stock y alerta de reposición por producto.
    columns:
      - name: producto_id
        data_tests: [unique, not_null]
      - name: punto_reposicion
        data_tests: [not_null]

  - name: mart_desempeno_vendedores
    description: Ventas acumuladas, participación y ranking por vendedor.
    columns:
      - name: vendedor_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendedores')
                field: vendedor_id

  - name: mart_clasificacion_abc
    description: Clasificación ABC de productos según su facturación acumulada.
    columns:
      - name: producto_id
        data_tests: [unique, not_null]
      - name: clase_abc
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [A, B, C]
