name: minimercado
version: "1.0.0"
config-version: 2
profile: minimercado

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Esquema donde dlt deja las tablas crudas (dataset_name del pipeline).
  raw_schema: raw_data
  # Días de cobertura mínima antes de reponer un producto.
  dias_reposicion: 7

models:
  minimercado:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
